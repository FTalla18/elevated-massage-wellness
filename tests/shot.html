<!DOCTYPE html><html><head><meta charset="utf-8"></head><body style="margin:0">
<iframe id="f" src="../index.html" style="width:100vw;height:100vh;border:0"></iframe>
<script>
// ?scroll=<px> scrolls the page; ?chat=<question> opens Ellie and asks
const q = new URLSearchParams(location.search);
f.onload = () => setTimeout(() => {
  const w = f.contentWindow, d = f.contentDocument;
  const st = d.createElement("style"); st.textContent = "*,*::before,*::after{transition:none!important;animation:none!important}"; d.head.appendChild(st); d.querySelectorAll(".reveal").forEach((e) => e.classList.add("in"));
  if (q.get("scroll")) { d.documentElement.style.scrollBehavior = "auto"; w.scrollTo(0, Number(q.get("scroll"))); }
  if (q.get("chat")) { d.getElementById("ellieFab").click(); setTimeout(() => { const i = d.getElementById("ellieIn"); i.value = q.get("chat"); d.getElementById("ellieForm").requestSubmit(); }, 300); }
  if (q.get("svc")) d.querySelector(`[data-service="${q.get("svc")}"]`).click();
}, 500);
</script></body></html>
